name: Supabase keepalive

# Free-tier Supabase projects pause after a week without activity. This writes
# to the database twice a week (public.keepalive_ping bumps a counter).
on:
  schedule:
    - cron: '17 6 * * 1,4' # Mondays and Thursdays, 06:17 UTC
  workflow_dispatch:

permissions:
  actions: write # lets the job re-enable itself (see last step)

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Bump keepalive counter
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_ANON_KEY" || { echo "Missing SUPABASE_URL or SUPABASE_ANON_KEY secret"; exit 1; }
          curl --fail-with-body -sS --retry 3 --retry-delay 20 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive_ping" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'

      # GitHub disables scheduled workflows after 60 days without repo activity;
      # re-enabling on every run keeps the schedule alive.
      - name: Keep this schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/supabase-keepalive.yml/enable"
